site_name: LCSC Learning Hub
site_url: https://docs.letzpwn.lu
repo_url: https://github.com/LetzPwn/lcsc-mkdocs
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  font:
    text: Roboto Mono
    code: Roboto Mono
  palette:
    - scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: green
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
    - awesome-pages
    - search
    - tags
    - redirects:
        redirect_maps: {}
    - git-revision-date-localized:
        enable_creation_date: true
    - glightbox
    - minify:
        minify_html: true
    - htmlproofer:
        validate_external_urls: false
nav:
    - Start here: index.md
    - Tags: tags.md
    - Cryptography:
        - cryptography/introduction.md
        - cryptography/ressources.md
    - Web Security:
        - web-security/introduction.md
        - web-security/ressources.md
    - Reverse Engineering:
        - reverse-engineering/introduction.md
        - "A first challenge: The Oracle's Whimsy": reverse-engineering/a-first-challenge.md
        - reverse-engineering/ressources.md
    - Pwn:
        - pwn/introduction.md
        - pwn/ressources.md     
    #- Digital Forensics:
    #    - digital-forensics/introduction.md
    #- Binary Exploitation:
    #    - binary-exploitation/introduction.md
    #- Network Analysis:
    #    - network-analysis/introduction.md
    #- OSINT:
    #    - osint/introduction.md
    #- Hardware Security:
    #    - hardware-security/introduction.md
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
    
    
   
