site_name: LCSC Learning Hub
site_url: https://docs.letzpwn.lu
repo_url: https://github.com/LetzPwn/lcsc-mkdocs
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  font:
    text: Roboto Mono
    code: Roboto Mono
  palette:
    - scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: green
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
    - awesome-pages
    - macros
    - search
    - tags
    - redirects:
        redirect_maps:
            cryptography/introduction.md: cryptography/index.md
            web-security/introduction.md: web-security/index.md
            reverse-engineering/introduction.md: reverse-engineering/index.md
            pwn/introduction.md: pwn/index.md
            digital-forensics/introduction.md: digital-forensics/index.md
            binary-exploitation/introduction.md: binary-exploitation/index.md
            network-analysis/introduction.md: network-analysis/index.md
            osint/introduction.md: osint/index.md
            hardware-security/introduction.md: hardware-security/index.md
    - git-revision-date-localized:
        enable_creation_date: true
    - git-committers:
        repository: LetzPwn/lcsc-mkdocs
        branch: main
        token: !ENV [GITHUB_TOKEN, ""]
    - glightbox
    - social:
        cards_layout_options:
            background_image: docs/assets/social-card-bg.png
            background_color: transparent
            color: "#FFFFFF"
    - minify:
        minify_html: true
    - htmlproofer:
        validate_external_urls: false
    - privacy
nav:
    - Start here: index.md
    - Tags: tags.md
    - Cryptography:
        - cryptography/index.md
        - cryptography/ressources.md
    - Web Security:
        - web-security/index.md
        - web-security/ressources.md
    - Reverse Engineering:
        - reverse-engineering/index.md
        - "A first challenge: The Oracle's Whimsy": reverse-engineering/a-first-challenge.md
        - reverse-engineering/ressources.md
    - Pwn:
        - pwn/index.md
        - pwn/ressources.md
    #- Digital Forensics:
    #    - digital-forensics/index.md
    #- Binary Exploitation:
    #    - binary-exploitation/index.md
    #- Network Analysis:
    #    - network-analysis/index.md
    #- OSINT:
    #    - osint/index.md
    #- Hardware Security:
    #    - hardware-security/index.md
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
    
    
   
